name: Build production Martin GLB

on:
  workflow_dispatch:
  push:
    branches: [ godot-avatar-v1 ]
    paths:
      - 'godot-avatar/tools/build_martin_blender.py'
      - 'godot-avatar/tools/build_martin_v21.py'
      - 'godot-avatar/THIRD_PARTY_ASSETS.md'
      - '.github/workflows/build-production-avatar.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'godot-avatar/tools/build_martin_blender.py'
      - 'godot-avatar/tools/build_martin_v21.py'
      - 'godot-avatar/THIRD_PARTY_ASSETS.md'
      - '.github/workflows/build-production-avatar.yml'

permissions:
  contents: write

jobs:
  build-model:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender headless runtime
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1 libgl1 libglx-mesa0 libglu1-mesa
          blender --version | head -n 2
          timeout 20s blender -b --python-expr 'import numpy,bpy; print("BLENDER_NUMPY_OK", numpy.__version__); bpy.ops.wm.quit_blender()' 2>&1 | tee blender-numpy.log
          grep -q 'BLENDER_NUMPY_OK' blender-numpy.log

      - name: Generate Martin v2.1 rig, materials and animations
        env:
          MARTIN_OUT: ${{ github.workspace }}/godot-avatar/models/production/martin.glb
          MARTIN_PREVIEW: ${{ github.workspace }}/martin-v21-preview.png
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
        run: |
          set -euxo pipefail
          timeout 240s blender -b --factory-startup --python godot-avatar/tools/build_martin_v21.py 2>&1 | tee martin-blender.log
          grep -q 'MARTIN_V21_RIG' martin-blender.log
          grep -q 'MARTIN_V21_GLB_OK' martin-blender.log
          grep -q 'MARTIN_ACTION DefaultAnim' martin-blender.log
          grep -q 'MARTIN_ACTION Cheer' martin-blender.log
          grep -q 'MARTIN_ACTION Walk' martin-blender.log
          grep -q 'MARTIN_ACTION Run' martin-blender.log
          test -s godot-avatar/models/production/martin.glb
          test "$(stat -c%s godot-avatar/models/production/martin.glb)" -gt 200000
          test -s martin-v21-preview.png
          file godot-avatar/models/production/martin.glb
          file martin-v21-preview.png | grep PNG
          ls -lh godot-avatar/models/production/martin.glb martin-v21-preview.png

      - name: Upload generated model and preview before branch mutation
        uses: actions/upload-artifact@v4
        with:
          name: martin-v21-production
          path: |
            godot-avatar/models/production/martin.glb
            martin-v21-preview.png
            martin-blender.log
          if-no-files-found: error

      - name: Commit generated production model
        if: github.event_name == 'push'
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add godot-avatar/models/production/martin.glb
          if git diff --cached --quiet; then
            echo 'No model change to commit'
            exit 0
          fi
          git commit -m 'Generate Martin v2.1 production GLB [skip model-build]'
          git pull --rebase origin godot-avatar-v1
          git push origin HEAD:godot-avatar-v1
