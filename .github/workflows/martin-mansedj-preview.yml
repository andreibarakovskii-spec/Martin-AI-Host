name: Martin Mansedj CC0 Preview

# Candidate refresh: 2026-08-27
on:
  push:
    branches: [godot-avatar-v1]
    paths:
      - 'godot-avatar/tools/render_mansedj_candidate.py'
      - '.github/workflows/martin-mansedj-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-mansedj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libglx-mesa0 libglu1-mesa mesa-utils unzip
          blender --version

      - name: Download CC0 rigged feline base
        run: |
          curl -L --fail --retry 3 \
            'https://opengameart.org/sites/default/files/miguel_blender3-6-1.zip' \
            -o /tmp/mansedj.zip
          mkdir -p /tmp/mansedj
          unzip -o /tmp/mansedj.zip -d /tmp/mansedj
          find /tmp/mansedj -type f -iname '*.blend' -print
          BLEND_FILE="$(find /tmp/mansedj -type f -iname '*.blend' | head -n 1)"
          test -n "$BLEND_FILE"
          echo "BLEND_FILE=$BLEND_FILE" >> "$GITHUB_ENV"

      - name: Render five candidate angles
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless
        run: |
          mkdir -p martin-mansedj-preview
          blender -b "$BLEND_FILE" \
            -P godot-avatar/tools/render_mansedj_candidate.py \
            -- --output-dir "$GITHUB_WORKSPACE/martin-mansedj-preview"
          ls -lh martin-mansedj-preview

      - name: Upload candidate renders
        uses: actions/upload-artifact@v4
        with:
          name: Martin-Mansedj-preview
          path: martin-mansedj-preview/*.png
          if-no-files-found: error