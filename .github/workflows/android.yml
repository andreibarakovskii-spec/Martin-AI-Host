name: Build Martin AI Host APK

on:
  push:
    branches: [ main, godot-avatar-v1 ]
  pull_request:
    branches: [ main, godot-avatar-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate current MVP source
        run: |
          python3 - <<'PY'
          import pathlib
          main=pathlib.Path('app/src/main/java/com/imagine/martinhost/MainActivity.java').read_text()
          assert 'ContinuousSpeechEngine' in main, 'Continuous Meeting audio missing from launcher'
          assert 'GroqTranscriber' in main, 'Whisper transcription missing from launcher'
          assert 'TurnManager' in main, 'self-speech gate missing from launcher'
          manifest=pathlib.Path('app/src/main/AndroidManifest.xml').read_text()
          assert '.MainActivity' in manifest and 'android.intent.action.MAIN' in manifest, 'MainActivity launcher missing'
          neural=pathlib.Path('app/src/main/java/com/imagine/martinhost/MartinNeuralSpeaker.kt')
          assert neural.exists(), 'Neural speaker source missing'
          print('MVP source smoke: OK')
          PY
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Validate APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -p app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml >/dev/null
          echo 'APK build: OK'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android MVP smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.imagine.martinhost
            adb shell monkey -p com.imagine.martinhost -c android.intent.category.LAUNCHER 1
            sleep 3
            FOCUS="$(adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | head -n 2)"
            echo "$FOCUS"
            echo "$FOCUS" | grep -q 'com.imagine.martinhost/.MainActivity'
            adb exec-out screencap -p > martin-mvp.png
            test -s martin-mvp.png
      - name: Upload MVP screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Martin-MVP-screenshot
          path: martin-mvp.png
          if-no-files-found: warn
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Martin-AI-Host-MVP-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
