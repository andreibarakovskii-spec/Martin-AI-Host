name: Build voice party APK
on:
  push:
    branches: [voice-orb-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/cache/restore@v4
        id: signing
        with:
          path: ${{ runner.temp }}/martin-signing
          key: martin-diagnostics-signing-v2
      - name: Ensure persistent diagnostic signing key
        run: |
          MARTIN_DEBUG_KEYSTORE="$RUNNER_TEMP/martin-signing/debug.keystore"
          echo "MARTIN_DEBUG_KEYSTORE=$MARTIN_DEBUG_KEYSTORE" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$MARTIN_DEBUG_KEYSTORE")"
          if [ ! -f "$MARTIN_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$MARTIN_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Unit tests and build
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest -PdiagnosticCopy=true --stacktrace
      - name: Check APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          if unzip -l "$APK" | grep -E 'libgodot|martin.glb|MartinProduction'; then exit 1; fi
          sha256sum "$APK" > apk-sha256.txt
      - name: Preserve diagnostic signing key
        if: steps.signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/martin-signing
          key: martin-diagnostics-signing-v2
      - uses: actions/upload-artifact@v4
        with:
          name: Sergey-Party-Host-0.9.8-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
      - name: Enable emulator acceleration for runner
        run: |
          test -e /dev/kvm
          sudo chown "$(id -un)" /dev/kvm
          sudo chmod u+rw /dev/kvm
      - name: Emulator launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am start -W -n com.imagine.martinhost.diagnostics/com.imagine.martinhost.PremiumMainActivity
            sleep 15
            adb shell pidof com.imagine.martinhost.diagnostics
            adb shell am instrument -w -e class com.imagine.martinhost.FastVoiceSmokeTest com.imagine.martinhost.diagnostics.test/androidx.test.runner.AndroidJUnitRunner > native-test.txt
            cat native-test.txt
            adb logcat -d > logcat.txt
            grep -E "FastVoiceSmoke|Fatal signal|FATAL EXCEPTION|sherpa|onnx|Abort message" logcat.txt || true
            grep -q "OK (1 test)" native-test.txt
            if grep -q 'FATAL EXCEPTION' logcat.txt; then exit 1; fi
            adb exec-out screencap -p > voice-orb-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Martin-Voice-Party-QA
          path: |
            native-test.txt
            voice-orb-screen.png
            logcat.txt
            app/build/reports/tests/
