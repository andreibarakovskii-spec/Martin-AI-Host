name: Build voice party APK
on:
  push:
    branches: [voice-orb-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests and build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Check APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          if unzip -l "$APK" | grep -E 'libgodot|martin.glb|MartinProduction'; then exit 1; fi
          sha256sum "$APK" > apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Martin-Voice-Party-0.9.0-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
      - name: Emulator launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.imagine.martinhost.fixed/com.imagine.martinhost.PremiumMainActivity
            sleep 15
            adb shell pidof com.imagine.martinhost.fixed
            adb logcat -d > logcat.txt
            if grep -q 'FATAL EXCEPTION' logcat.txt; then exit 1; fi
            adb exec-out screencap -p > voice-orb-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Martin-Voice-Party-QA
          path: |
            voice-orb-screen.png
            logcat.txt
            app/build/reports/tests/
