name: Build Martin AI Host APK
on:
  push:
    branches: [godot-avatar-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore and validate Martin portrait
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app/src/main/assets/martin_portrait.b64 > app/src/main/res/drawable-nodpi/martin_idle.jpg
          test -s app/src/main/res/drawable-nodpi/martin_idle.jpg
          file app/src/main/res/drawable-nodpi/martin_idle.jpg | grep -E 'JPEG|PNG'
          grep -q 'PremiumMainActivity' app/src/main/AndroidManifest.xml
          grep -q '@mipmap/ic_launcher' app/src/main/AndroidManifest.xml
          grep -q '@drawable/martin_idle' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Validate built APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Martin-AI-Host-v0.4.0-fixed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
