name: Build Martin Voice Party APK
on:
  push:
    branches: [godot-avatar-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Verify voice-party tree
        run: |
          set -euxo pipefail
          test -s app/src/main/java/com/imagine/martinhost/VoiceOrbView.java
          test -s app/src/main/java/com/imagine/martinhost/LeanPartyActivity.java
          test -s app/src/main/java/com/imagine/martinhost/PartyDirector.java
          test -s app/src/main/java/com/imagine/martinhost/MartinFaceTracker.java
          grep -q 'LeanPartyActivity' app/src/main/AndroidManifest.xml
          ! grep -q 'org.godotengine:godot' app/build.gradle.kts
          grep -q '0.9.0-voice-party' app/build.gradle.kts
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" > apk-list.txt
          test "$(stat -c%s "$APK")" -lt 180000000
          echo "APK_BYTES=$(stat -c%s "$APK")"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Martin-AI-Host-v0.9.0-voice-party
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
