name: Build Martin AI Host APK
on:
  push:
    branches: [godot-avatar-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source tree and restore Martin portrait
        run: |
          set -euxo pipefail
          test -s app/src/main/assets/martin_portrait_valid.b64
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app/src/main/assets/martin_portrait_valid.b64 > app/src/main/res/drawable-nodpi/martin_idle.jpg
          test -s app/src/main/res/drawable-nodpi/martin_idle.jpg
          file app/src/main/res/drawable-nodpi/martin_idle.jpg | grep 'JPEG image data'
          grep -q 'PremiumMainActivity' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' app/src/main/AndroidManifest.xml
          grep -q '@mipmap/ic_launcher' app/src/main/AndroidManifest.xml
          grep -q '@drawable/martin_idle' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'R.drawable.martin_idle' app/src/main/java/com/imagine/martinhost/MartinSpriteView.java
          grep -q 'applicationId = "com.imagine.martinhost.fixed"' app/build.gradle.kts
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Validate APK payload
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -E 'martin_idle|resources.arsc'
          echo "Built from $GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: Martin-AI-Host-v0.4.1-fixed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
