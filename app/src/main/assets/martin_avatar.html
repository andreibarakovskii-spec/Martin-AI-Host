<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070811}body{font-family:Arial,sans-serif}.scene{position:relative;width:100%;height:100%;overflow:hidden;border-radius:28px;background:radial-gradient(circle at 50% 42%,#482191 0,#131226 38%,#070811 74%)}.bg{position:absolute;inset:-2%;background:linear-gradient(180deg,#14215444,#05050d99),radial-gradient(circle at 72% 18%,#f02aff55,transparent 34%),radial-gradient(circle at 18% 22%,#184eff44,transparent 32%);animation:bgPulse 5s ease-in-out infinite}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;filter:saturate(1.12) contrast(1.03) brightness(.94);transform:scale(1.025);transform-origin:50% 56%;animation:idle 3.8s ease-in-out infinite;transition:filter .35s,transform .35s}.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,#07081125 65%,#070811d9 100%);pointer-events:none}.halo{position:absolute;width:76%;aspect-ratio:1;border-radius:50%;left:12%;top:13%;border:1px solid #b46cff55;box-shadow:0 0 44px #873dff66,inset 0 0 50px #2d20ff25;animation:halo 2.8s ease-in-out infinite;pointer-events:none}.status{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);min-width:176px;padding:9px 15px;border-radius:22px;text-align:center;color:#fff;font-weight:700;font-size:14px;background:#080b18aa;border:1px solid #a14eff88;backdrop-filter:blur(12px);box-shadow:0 0 24px #713cff55;opacity:0;transition:.25s}.waves{position:absolute;left:50%;top:44%;width:94px;height:94px;transform:translate(-50%,-50%);opacity:0}.waves i{position:absolute;inset:0;border:2px solid #af5cff;border-radius:50%;animation:wave 1.5s ease-out infinite}.waves i:nth-child(2){animation-delay:.35s}.waves i:nth-child(3){animation-delay:.7s}.dots{position:absolute;top:18px;right:18px;display:flex;gap:6px;opacity:0}.dots i{width:9px;height:9px;background:#fff;border-radius:50%;box-shadow:0 0 14px #b865ff;animation:dots 1s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}.badge{position:absolute;right:18px;bottom:20px;padding:8px 12px;border-radius:16px;background:#0d1020cc;border:1px solid #7d4cff88;color:#fff;font-size:13px;font-weight:700;opacity:0;backdrop-filter:blur(10px)}.state-listening .waves,.state-listening .status,.state-thinking .dots,.state-thinking .status,.state-talking .status,.state-game .badge,.state-toast .badge,.state-dj .badge,.state-happy .status,.state-sleeping .status{opacity:1}.state-listening .status:after{content:'Слушаю…'}.state-thinking .status:after{content:'Думаю…'}.state-talking .status:after{content:'Говорю…'}.state-happy .status:after{content:'Отлично! ✨'}.state-sleeping .status:after{content:'Мартин отдыхает'}.state-game .badge:after{content:'🎮 Игра'}.state-toast .badge:after{content:'🥂 Тост'}.state-dj .badge:after{content:'🎧 DJ'}.state-listening .photo{transform:scale(1.055) rotate(-.25deg);filter:saturate(1.18) contrast(1.04) brightness(.98)}.state-thinking .photo{animation:think 2.4s ease-in-out infinite;filter:saturate(.96) brightness(.9)}.state-talking .photo,.state-game .photo,.state-toast .photo{animation:talk 1.15s ease-in-out infinite}.state-dj .photo{animation:dj .62s ease-in-out infinite alternate;filter:saturate(1.35) contrast(1.07)}.state-sleeping .photo{filter:saturate(.65) brightness(.65) blur(.2px)}@keyframes idle{0%,100%{transform:scale(1.025) translateY(2px)}50%{transform:scale(1.038) translateY(-5px)}}@keyframes talk{0%,100%{transform:scale(1.03) translateY(0)}45%{transform:scale(1.045) translateY(-5px)}70%{transform:scale(1.036) translateY(-2px)}}@keyframes think{0%,100%{transform:scale(1.025) rotate(-.35deg)}50%{transform:scale(1.035) rotate(.5deg)}}@keyframes dj{from{transform:scale(1.04) rotate(-.7deg) translateY(-2px)}to{transform:scale(1.055) rotate(.7deg) translateY(3px)}}@keyframes halo{0%,100%{transform:scale(.96);opacity:.58}50%{transform:scale(1.05);opacity:1}}@keyframes wave{0%{opacity:.9;transform:scale(.55)}100%{opacity:0;transform:scale(1.8)}}@keyframes dots{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-7px);opacity:1}}@keyframes bgPulse{0%,100%{filter:brightness(.9)}50%{filter:brightness(1.13)}}</style></head><body><div id="scene" class="scene state-idle"><div class="bg"></div><div class="halo"></div><img class="photo" id="photo" alt="Martin" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABgQEhUSDxgVExUaGRgcIzsmIyAgI0gzNis7VUtaWFRLUlFeaodzXmSAZVFSdqB3gIyQl5mXW3GmsqWTsIeUl5L/2wBDARkaGiMfI0UmJkWSYVJhkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpKSkpL/wgARCAGkAWgDASIAAhEBAxEB/8QAGgAAAwEBAQEAAAAAAAAAAAAAAAEDAgQFBv/EABkBAAMBAQEAAAAAAAAAAAAAAAABAgMEBf/aAAwDAQACEAMQAAAB8usqp7a1eixTWdQz0SqJFFcdcvTi35p6PLvlJ4LNJIGmBl2cVB9Xdm5cXRy4Xnr5e9Ob0525eXr5unmwNa5mkI16PB78UtcOs9uvxvTyZ+MM1kAZK0r8lm8dFaYXTnLSBSdLGalTbj7MSS7OIvPq479O0eYehz7TL0LU57WObkzv0lyIXTzUGuXrxhO+86jbljWfRhEDfIBh0e34XuY15bryrur6fJ1Rh4Dc98NGRLHfwe5x68FtPPd6yZvM7qjmz0Y1WtGmcsemdTjU3eHR6HldQ6c6526QtMnW8aR39M8y982ZgqKdVJZ3rEBrfIYxP2fI9bO6wtTn1XLXx6WZ6KjAEHT0875evsty2iZ57Ip8x0ZbxrUx6aN5xiuHUJdEr5t7zWlhd7l+dOgLDWwctyBuaC1OajNFluuQ0tshvYlvOE3qWMtNYRk2JpZAR1hnDrvuG1PTSDxrpUE5vOUrfTKnPqrzrJ1ExTXm36GZw+nl45BvWNtLTaJwtzsyr+gl49PU8pnV1cNdDB28vTmt4QlC2JUm84aNaJc9JpoY12StDn6NdPNYV09YazNJtQ6ObeLxzfSKRygn0SLytyrEgYYq35egdmaT5uTt42q15XMe1Hn9BvwrrodZ6+TWo+fr498sY3mBLSyYzMUmJjEC6Mjy11aF5rr2q81c5aJU+Tr4+uV18tejKWlSBTpEUay9iV5/NTqS4ujmq33Uj0Koef6nnCgDc9/dzbhQrvFaZwp2uiFZbzDU2oWdGdZNKWm8iRoDW8bm99nJ256dVYU55nGk51xxd3D2y8az149pueF80tYmeq7zK8+e5EumKj6+rk6yzz/SiHHTXRGeN5nWlJbTJpSpXzme6zNihNGbAYJMRoBo3GsaW7eHsWtCNOXTajSlni6+TpgDq6suzzvR4eW+fPVQiXVCiOTh9V55ceuh1eemWntbK5lXZbFXlycff5zKpTDWMFzbn6ePVNGoWE9J43hpDVGYNATpOirfVzXWuxPLSPTzXbfJ18ukHqeX6l5y5qc2ZevOCvrm2iuZUB9aqifl+0B499XWnRM5nnPjLsjnc2k8X0ly
